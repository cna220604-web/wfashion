<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#773c3d">
  <title>Đang ngoại tuyến — W Studio</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #292320; background: #f5f0e8; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: radial-gradient(ellipse at 12% 18%, #e7d4c2 0, transparent 34%), #f5f0e8; }
    main { width: min(100%, 480px); padding: clamp(30px, 8vw, 58px); border: 1px solid #e3d9cd; border-radius: 26px; background: #fffdf9; box-shadow: 0 24px 70px rgb(52 37 28 / 10%); text-align: center; }
    .brand { color: #773c3d; font: italic 36px Georgia, serif; }
    .brand span { font: 700 10px "Segoe UI", Arial, sans-serif; letter-spacing: .2em; }
    h1 { margin: 28px 0 12px; font: 400 clamp(30px, 8vw, 42px) Georgia, serif; }
    p { color: #786e65; font-size: 14px; line-height: 1.8; }
    button { margin-top: 16px; padding: 14px 22px; border: 0; border-radius: 12px; color: white; background: #773c3d; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="brand">W <span>STUDIO</span></div>
    <h1>Bạn đang ngoại tuyến</h1>
    <p>Hãy kiểm tra kết nối mạng rồi thử lại. Đăng nhập, đặt hàng và stylist AI cần có kết nối internet.</p>
    <button type="button" onclick="location.reload()">Thử kết nối lại</button>
  </main>
</body>
</html>
