services:
  - type: web
    name: w-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: Database__Provider
        value: PostgreSQL
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Storage__PersistentPath
        value: /var/data
      - key: Storage__AllowLocalVideoStorage
        value: "true"
      - key: Storage__S3__Endpoint
        sync: false
      - key: Storage__S3__Bucket
        sync: false
      - key: Storage__S3__AccessKey
        sync: false
      - key: Storage__S3__SecretKey
        sync: false
      - key: Storage__S3__Region
        sync: false
      - key: Storage__S3__PublicBaseUrl
        sync: false
      - key: Storage__Avatars__S3__Endpoint
        sync: false
      - key: Storage__Avatars__S3__Bucket
        sync: false
      - key: Storage__Avatars__S3__AccessKey
        sync: false
      - key: Storage__Avatars__S3__SecretKey
        sync: false
      - key: Storage__Avatars__S3__Region
        sync: false
      - key: Storage__Avatars__S3__PublicBaseUrl
        sync: false
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      - key: Authentication__Facebook__AppId
        sync: false
      - key: Authentication__Facebook__AppSecret
        sync: false
      - key: Ai__Model
        value: gemini-3-flash-preview
      - key: Ai__ApiKey
        sync: false
      - key: Ai__Providers__1__Name
        value: Groq backup
      - key: Ai__Providers__1__Type
        value: Groq
      - key: Ai__Providers__1__Model
        value: openai/gpt-oss-20b
      - key: Ai__Providers__1__Endpoint
        value: https://api.groq.com/openai/v1/chat/completions
      - key: Ai__Providers__1__ApiKey
        sync: false
      - key: AdminBootstrap__Email
        sync: false
      - key: AdminBootstrap__Password
        sync: false
