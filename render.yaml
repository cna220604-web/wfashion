services:
  - type: web
    name: w-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: Database__Provider
        value: PostgreSQL
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Storage__PersistentPath
        value: /var/data
      - key: Ai__Model
        value: gemini-3-flash-preview
      - key: Ai__ApiKey
        sync: false
      - key: AdminBootstrap__Email
        sync: false
      - key: AdminBootstrap__Password
        sync: false
